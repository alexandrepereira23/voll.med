services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TOKEN_EXPIRACAO_HORAS: ${TOKEN_EXPIRACAO_HORAS:-2}
      ADMIN_LOGIN: ${ADMIN_LOGIN:?ADMIN_LOGIN is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CEP_API_KEY: ${CEP_API_KEY:?CEP_API_KEY is required}
      CEP_API_BASE_URL: http://consultacep:8080
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    depends_on:
      db:
        condition: service_healthy
      consultacep:
        condition: service_started

  consultacep:
    build:
      context: ${CEP_BACKEND_CONTEXT:-../cep/backend}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      API_KEY_VALOR: ${CEP_API_KEY:?CEP_API_KEY is required}
      CORS_ORIGENS_PERMITIDAS: ${CEP_CORS_ORIGENS_PERMITIDAS:?CEP_CORS_ORIGENS_PERMITIDAS is required}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      VOLL_MED_API_DOMAIN: ${VOLL_MED_API_DOMAIN:?VOLL_MED_API_DOMAIN is required}
      CEP_API_DOMAIN: ${CEP_API_DOMAIN:?CEP_API_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
      consultacep:
        condition: service_started

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
